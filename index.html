<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#ffffff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.loader{position:relative;width:80px;height:80px}
.ring{position:absolute;width:100%;height:100%;border-radius:50%;border:4px solid transparent;animation:spin 1.4s cubic-bezier(.65,.05,.35,.95) infinite}
.ring:nth-child(1){border-top-color:#25D366;animation-delay:0s}
.ring:nth-child(2){width:60px;height:60px;top:10px;left:10px;border-right-color:#128C7E;animation-delay:-.3s;animation-direction:reverse}
.ring:nth-child(3){width:40px;height:40px;top:20px;left:20px;border-bottom-color:#25D366;animation-delay:-.6s}
.dot{position:absolute;width:10px;height:10px;background:#25D366;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 12px #25D36688;animation:pulse 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}50%{transform:translate(-50%,-50%) scale(1.4);opacity:.6}}
</style>
</head>
<body>
<div class="loader">
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="dot"></div>
</div>
<script>
setTimeout(function(){
  window.location.replace("https:\/\/apigxdikzz.vercel.app");
},400);
</script>
</body>
</html>
